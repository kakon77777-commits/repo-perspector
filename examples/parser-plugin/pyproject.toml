[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-perspector-parser"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["repo-perspector>=0.6,<0.7"]

[project.entry-points."repo_perspector.parsers"]
demo = "demo_perspector_parser:DemoParser"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
