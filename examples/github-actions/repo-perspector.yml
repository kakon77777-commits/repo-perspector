name: Repository Architecture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 300

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Repo Perspector
        run: python -m pip install .

      - name: Analyze architecture
        run: repo-perspector analyze . --history-commits 300 --workers 4 --skip-generated -o architecture-report

      - name: Enforce architecture thresholds
        run: repo-perspector check architecture-report --fail-on error

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: architecture-report/architecture.sarif

      - name: Upload architecture report
        uses: actions/upload-artifact@v4
        with:
          name: repository-architecture
          path: architecture-report/
